[project]
name = "koukai2-converter"
version = "0.1.0"
description = "OpenVoyage offline converter: the player's own original data files -> Godot-friendly assets"
requires-python = ">=3.10"
dependencies = ["capstone>=5"]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["koukai2"]
